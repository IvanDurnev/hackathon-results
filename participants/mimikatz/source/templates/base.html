<!doctype html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}RT_Генератор{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: { sans: ["Inter", "sans-serif"] },
          boxShadow: { glass: "0 12px 40px rgba(15, 23, 42, 0.35)" }
        }
      }
    };
  </script>
  <style>
    .glass {
      backdrop-filter: blur(14px);
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.45), rgba(15, 23, 42, 0.25));
      border: 1px solid rgba(148, 163, 184, 0.25);
    }
    .light .glass {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0.55));
      border: 1px solid rgba(148, 163, 184, 0.35);
    }
    .app-scroll {
      scrollbar-width: thin;
      scrollbar-color: rgba(129, 140, 248, 0.75) rgba(30, 41, 59, 0.45);
    }
    .app-scroll::-webkit-scrollbar {
      width: 10px;
    }
    .app-scroll::-webkit-scrollbar-track {
      border-radius: 999px;
      background: rgba(30, 41, 59, 0.45);
      border: 1px solid rgba(100, 116, 139, 0.25);
    }
    .app-scroll::-webkit-scrollbar-thumb {
      border-radius: 999px;
      border: 2px solid rgba(15, 23, 42, 0.2);
      background: linear-gradient(180deg, rgba(99, 102, 241, 0.95), rgba(139, 92, 246, 0.9));
    }
    .light .app-scroll {
      scrollbar-color: rgba(99, 102, 241, 0.75) rgba(203, 213, 225, 0.7);
    }
    .light .app-scroll::-webkit-scrollbar-track {
      background: rgba(203, 213, 225, 0.7);
      border-color: rgba(148, 163, 184, 0.4);
    }
    .light .app-scroll::-webkit-scrollbar-thumb {
      border-color: rgba(248, 250, 252, 0.8);
    }
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 light:bg-slate-100 light:text-slate-900 transition-colors duration-300">
  <div class="pointer-events-none fixed inset-0 -z-10 bg-[radial-gradient(circle_at_10%_10%,rgba(99,102,241,0.25),transparent_40%),radial-gradient(circle_at_90%_20%,rgba(168,85,247,0.22),transparent_35%)]"></div>
  <header class="sticky top-0 z-40 border-b border-slate-700/50 light:border-slate-300/70 bg-slate-950/70 light:bg-slate-100/70 backdrop-blur">
    <div class="mx-auto flex w-full max-w-7xl items-center justify-between px-5 py-4">
      <div class="flex items-center gap-3">
        <div class="rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 p-2 shadow-lg">
          <i data-lucide="sparkles" class="h-5 w-5 text-white"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight">RT_Генератор</h1>
        </div>
      </div>
    </div>
  </header>
  <main class="mx-auto w-full max-w-7xl px-5 py-8">
    {% block content %}{% endblock %}
  </main>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    (function initTheme() {
      const root = document.documentElement;
      root.classList.add("dark");
      root.classList.remove("light");
    })();
    lucide.createIcons();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
