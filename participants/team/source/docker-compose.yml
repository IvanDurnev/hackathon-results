services:
  db:
    image: postgres:17-alpine
    container_name: cool-peppers-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test1
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cool-peppers-api
    restart: unless-stopped
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test1
      FRONTEND: http://localhost:8080
      BACKEND_CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      AI_HOST: host.docker.internal
      AI_PORT: 11434
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cool-peppers-frontend
    restart: unless-stopped
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
